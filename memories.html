<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories | Abhinand V S</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles_royal.css">
    <link rel="stylesheet" href="memories.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Background Decorations -->
    <div class="bg-decorations">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>

    <!-- Page Switcher Button -->
    <a href="index.html" class="page-switch-btn" title="Switch to Professional Page">
        <i class="fas fa-exchange-alt"></i><span> Professional</span>
    </a>

    <style>
        /* Page Switcher Button */
        .page-switch-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #ffffff;
            border: 1px solid rgba(30, 58, 43, 0.2);
            color: var(--forest-primary, #1e3a2b);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1rem;
            z-index: 2000;
            transition: all 0.35s ease;
            box-shadow: 0 8px 24px rgba(22, 47, 33, 0.08);
        }

        .page-switch-btn span {
            display: none;
        }

        .page-switch-btn:hover {
            background: var(--forest-primary, #1e3a2b);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(30, 58, 43, 0.2);
        }
    </style>

    <!-- Page Header -->
    <header class="page-header">
        <h1 class="page-title">Memories</h1>
        <p class="page-subtitle">A collection of moments, captured and cherished.</p>
    </header>

    <!-- Memories Gallery -->
    <section class="gallery-wrapper">
        <div class="gallery-container" id="memory-gallery">
            <!-- Images will be injected here by memories.js -->
        </div>
    </section>

    <script src="memories.js"></script>
</body>

</html>
