<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads | Abhinand V S</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="styles_royal.css">
    <style>
        .page-header {
            text-align: center;
            padding: 120px 20px 30px;
        }

        .page-header h1 {
            font-size: 3.4rem;
            letter-spacing: -0.02em;
            color: var(--forest-primary);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .back-nav {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            background: #ffffff;
            border: 1px solid rgba(30, 58, 43, 0.18);
            border-radius: var(--radius-full);
            color: var(--forest-primary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(22, 47, 33, 0.05);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--forest-primary);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 43, 0.2);
        }

        .download-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 24px 100px;
            position: relative;
            z-index: 2;
        }
        
        .download-card {
            background: #ffffff;
            border: var(--liquid-border);
            border-top: var(--liquid-border-top);
            border-radius: var(--radius-xl);
            padding: 50px 36px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: var(--liquid-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .download-card:hover {
            transform: translateY(-6px);
            border-color: rgba(30, 58, 43, 0.22);
            box-shadow: var(--liquid-shadow-hover);
        }

        .download-icon {
            font-size: 3.8rem;
            color: var(--forest-accent);
            margin-bottom: 5px;
        }

        .download-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--forest-deep);
            margin: 0;
        }

        .download-desc {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 480px;
            line-height: 1.65;
            margin: 0;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--forest-primary);
            color: #ffffff;
            padding: 14px 34px;
            border-radius: var(--radius-full);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 1px solid var(--forest-primary);
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(30, 58, 43, 0.18);
            margin-top: 10px;
        }

        .download-btn:hover {
            background: var(--forest-accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(30, 58, 43, 0.28);
        }
    </style>
</head>

<body>
    <!-- Navigation Back Button -->
    <nav class="back-nav">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Home
        </a>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1 class="page-title">Downloads</h1>
        <p class="page-subtitle">Access my professional documents and resources</p>
    </header>

    <!-- Download Content -->
    <section class="download-container">
        <div class="download-card">
            <i class="fas fa-file-pdf download-icon"></i>
            <h2 class="download-title">Curriculum Vitae</h2>
            <p class="download-desc">Download my latest resume to learn more about my skills, experience, and educational background.</p>
            <a href="resume.html" class="download-btn">
                <i class="fas fa-file-alt"></i> View Full Resume
            </a>
        </div>
    </section>

</body>

</html>
